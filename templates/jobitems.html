<div class="border-bottom row" style="margin-top: 16px; padding-bottom: 4px;">
    <div class="col-9 ">
        <h4 style="color: rgb(105, 32, 173); margin-bottom: 8px; margin-top: 4px;">{{job['title']}}</h4>
        <div><b>Location:</b>{{job['location']}}</div> 
        {% if 'salary' in job %}
        <div><b>Salary:</b>{{job['salary']}}</div>
    {% endif %}
    </div>

    <div class="col-3"><button type="button" class="btn btn-outline-primary">Apply Now</button></div>
</div>
